apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "workloadguard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "workloadguard.labels" . | nindent 4 }}
---
# Same rules as deploy/rbac.yaml; see the comments there for what each one is used for.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "workloadguard.fullname" . }}
  labels:
    {{- include "workloadguard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [""]
    resources: [limitranges]
    verbs: [list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "workloadguard.fullname" . }}
  labels:
    {{- include "workloadguard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "workloadguard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "workloadguard.fullname" . }}
    namespace: {{ .Release.Namespace }}
