name: ci
on:
  push:
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: |
          go vet ./...
          go vet -tags integration ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: test
        run: go test -race ./...
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint charts/workloadguard
      - name: build image
        run: docker build -t workloadguard:ci .

  # The same steps as the README quick start, on a fresh kind cluster: cluster, samples,
  # build and deploy, hack/verify.sh, then the Go integration tests.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: install kind
        run: |
          go install sigs.k8s.io/kind@v0.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: cluster, samples, deploy, verify
        run: make all
      - name: integration tests
        run: go test -tags integration -count=1 ./internal/...
      - name: tool logs
        if: failure()
        run: kubectl --context kind-workloadguard -n workloadguard logs deploy/workloadguard --tail=200
