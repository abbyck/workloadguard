# kind cluster for developing and testing workloadguard.
#
# CNI: the default kindnet. Since kind v0.24 it enforces NetworkPolicy (ingress and
# egress), so no Calico install is needed. hack/netpol-check.sh proves enforcement.
#
# Two workers so pods can land on different nodes and policies are tested on
# cross-node traffic, not only same-node traffic.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: workloadguard
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
