# Sample workloads for developing and demoing workloadguard.
#   kubectl --context kind-workloadguard apply -k examples/
#
# Isolation targets (fully hardened, so hardening should leave them alone):
#   tenant-a/gateway, tenant-b/dashboard
# B's neighbour: tenant-b/reports. Isolating the dashboard by selector must leave it
# reachable; isolating all of tenant-b (allPods) must cut it off too.
# Bystander that must keep working while A and B are isolated:
#   shared/bystander
# Hardening targets:
#   legacy/unhardened (nothing set), legacy/partial (some values set, must be preserved)
#
# extras/ is NOT included here; apply it by hand for the pre-existing policy case (R2.4).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - tenant-a/gateway.yaml
  - tenant-b/dashboard.yaml
  - tenant-b/reports.yaml
  - shared/bystander.yaml
  - legacy/unhardened.yaml
  - legacy/partial.yaml
