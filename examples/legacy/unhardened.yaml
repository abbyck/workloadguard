# No resources and no securityContext at all. Baseline hardening (no privilege escalation,
# RuntimeDefault seccomp) should fill in its fields and the app should keep running.
# Under strict, dropping all capabilities and runAsNonRoot are fine (the image runs as
# uid 101 on port 8080), but readOnlyRootFilesystem breaks it, because nginx writes to /tmp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unhardened
  namespace: legacy
  labels:
    app: unhardened
spec:
  replicas: 1
  selector:
    matchLabels:
      app: unhardened
  template:
    metadata:
      labels:
        app: unhardened
    spec:
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
